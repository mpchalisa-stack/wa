      - name: Patch File Chooser MainActivity
        run: |
          node -e '
            const fs = require("fs");
            const entries = fs.existsSync("android") ? fs.readdirSync("android", { recursive: true }) : [];
            const javaFiles = entries
              .filter(f => typeof f === "string" && f.endsWith("MainActivity.java"))
              .map(f => "android/" + f.replace(/\\/g, "/"));

            const onShowMethod = `
                @Override
                public boolean onShowFileChooser(android.webkit.WebView webView, android.webkit.ValueCallback<android.net.Uri[]> cb, android.webkit.WebChromeClient.FileChooserParams params) {
                    if (wattappsFileCb != null) {
                        wattappsFileCb.onReceiveValue(null);
                    }
                    wattappsFileCb = cb;
                    android.content.Intent intent = params.createIntent();
                    try {
                        startActivityForResult(intent, 1042);
                    } catch (Exception e) {
                        wattappsFileCb = null;
                        return false;
                    }
                    return true;
                }
            `;

            for (const p of javaFiles) {
              let c = fs.readFileSync(p, "utf8");
              if (c.includes("class MainActivity") && !c.includes("wattappsFileCb")) {
                c = c.replace(
                  /(public\s+class\s+MainActivity[^{]*\{)/,
                  `$1\n    private android.webkit.ValueCallback<android.net.Uri[]> wattappsFileCb;`
                );

                if (c.includes("new android.webkit.WebChromeClient()") || c.includes("new WebChromeClient()")) {
                  c = c.replace(
                    /(new\s+(?:android\.webkit\.)?WebChromeClient\s*\(\s*\)\s*\{)/g,
                    `$1${onShowMethod}`
                  );
                }

                const lastBrace = c.lastIndexOf("}");
                if (lastBrace !== -1 && !c.includes("onActivityResult(")) {
                  const fallbackBlock = `
                @Override
                protected void onActivityResult(int requestCode, int resultCode, android.content.Intent data) {
                    super.onActivityResult(requestCode, resultCode, data);
                    if (requestCode == 1042 && wattappsFileCb != null) {
                        android.net.Uri[] res = android.webkit.WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                        wattappsFileCb.onReceiveValue(res);
                        wattappsFileCb = null;
                    }
                }
            `;
                  c = c.slice(0, lastBrace) + fallbackBlock + "\n}\n";
                }
                fs.writeFileSync(p, c);
              }
            }
          '

