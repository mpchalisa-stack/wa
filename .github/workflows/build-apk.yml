          node -e '
            const fs = require("fs");
            let rootGradle = fs.readFileSync("android/build.gradle", "utf8");
            if (!rootGradle.includes("com.google.gms:google-services")) {
              rootGradle = rootGradle.replace(
                /dependencies\s*\{/,
                "dependencies {\n        classpath \"com.google.gms:google-services:4.4.2\""
              );
              fs.writeFileSync("android/build.gradle", rootGradle);
            }

            let appGradle = fs.readFileSync("android/app/build.gradle", "utf8");
            if (!appGradle.includes("com.google.gms.google-services")) {
