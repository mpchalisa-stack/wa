            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:373114469262:android:8149352219a89a0c5d82df",
                  "android_client_info": {
                    "package_name": "mil.tniau.diskomlekau.wattappsau"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDZlBHU-LemnGVJDz62t3e-eaumm0lYGmo"
