name: Build WattappsAU APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Sync Android Project
        run: |
          mkdir -p www assets
          echo "<h1>WattappsAU Loading...</h1>" > www/index.html
          npm install --legacy-peer-deps
          npm install -D @capacitor/assets --legacy-peer-deps
          node -e '
            const fs = require("fs");
            const cfg = {
              appId: "mil.tniau.diskomlekau.wattappsau",
              appName: "WattappsAU",
              webDir: "www",
              server: {
                url: "https://wa-iota-lemon.vercel.app",
                cleartext: true
              },
              android: {
                allowMixedContent: true,
                captureInput: true,
                webContentsDebuggingEnabled: true
              }
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android || true
          fi
          if [ -f "logo.png" ]; then
            cp logo.png assets/icon.png
            npx capacitor-assets generate --android || true
          elif [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android || true
          fi

      - name: Configure Firebase FCM, KeepAliveService, Anti-Freeze WebView & Notifications
