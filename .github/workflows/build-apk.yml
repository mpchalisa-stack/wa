name: Build WattappsAU Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Bundle (Vite dist)
        run: npm run build

      - name: Add Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy google-services.json to android/app
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          elif [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure Android Gradle, Firebase Plugin, Permissions & App Icon
        run: node scripts/configure-android.mjs

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload WattappsAU Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WattappsAU-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
