                          if (url != null && url.startsWith("data:")) {
                              saveAndOpenBase64File(url, guessedName, mimetype);
                          } else if (url != null && url.startsWith("blob:")) {
                              String safeUrl = url.replace("'", "\\'");
                              String safeName = guessedName.replace("'", "\\'");
                              String safeMime = (mimetype != null ? mimetype : "").replace("'", "\\'");
                              String js = "(async()=>{try{const r=await fetch('" + safeUrl + "');const b=await r.blob();const fr=new FileReader();fr.onload=()=>{if(window.AndroidBridge&&window.AndroidBridge.downloadFile){window.AndroidBridge.downloadFile(fr.result,'" + safeName + "',b.type||'" + safeMime + "');}};fr.readAsDataURL(b);}catch(e){console.error(e);}})();";
                              webView.post(() -> webView.evaluateJavascript(js, null));
                          } else if (url != null && (url.startsWith("http://") || url.startsWith("https://"))) {
                              try {
                                  DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                                  req.setMimeType(mimetype);
                                  req.addRequestHeader("User-Agent", userAgent);
                                  req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                                  req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, guessedName);
                                  DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
