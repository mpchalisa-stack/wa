              private String resolveMimeTypeForAndroid(String fileName, String rawMime) {
                  if (rawMime != null && !rawMime.trim().isEmpty() && !"application/octet-stream".equalsIgnoreCase(rawMime.trim())) {
                      return rawMime.trim();
                  }
                  String lower = fileName != null ? fileName.toLowerCase(Locale.ROOT) : "";
                  if (lower.endsWith(".docx")) return "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
                  if (lower.endsWith(".doc")) return "application/msword";
                  if (lower.endsWith(".xlsx")) return "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
                  if (lower.endsWith(".xls")) return "application/vnd.ms-excel";
                  if (lower.endsWith(".pptx")) return "application/vnd.openxmlformats-officedocument.presentationml.presentation";
                  if (lower.endsWith(".ppt")) return "application/vnd.ms-powerpoint";
                  if (lower.endsWith(".pdf")) return "application/pdf";
                  if (lower.endsWith(".txt")) return "text/plain";
                  if (lower.endsWith(".csv")) return "text/csv";
                  if (lower.endsWith(".zip")) return "application/zip";
                  if (lower.endsWith(".jpg") || lower.endsWith(".jpeg")) return "image/jpeg";
                  if (lower.endsWith(".png")) return "image/png";
                  if (lower.endsWith(".webp")) return "image/webp";
                  if (lower.endsWith(".mp4")) return "video/mp4";
                  if (lower.endsWith(".mp3")) return "audio/mpeg";
                  return "application/octet-stream";
              }

              private boolean saveAndOpenBase64File(String dataUrlOrBase64, String fileName, String mimeType) {
                  try {
                      if (dataUrlOrBase64 == null || dataUrlOrBase64.isEmpty()) return false;
                      String base64Part = dataUrlOrBase64;
                      String extractedMime = mimeType;
                      int commaIdx = dataUrlOrBase64.indexOf(',');
                      if (commaIdx >= 0) {
                          String header = dataUrlOrBase64.substring(0, commaIdx);
                          base64Part = dataUrlOrBase64.substring(commaIdx + 1);
                          if ((extractedMime == null || extractedMime.isEmpty()) && header.startsWith("data:")) {
                              int semi = header.indexOf(';');
                              if (semi > 5) extractedMime = header.substring(5, semi);
                          }
                      }
                      byte[] bytes = Base64.decode(base64Part.replaceAll("\\s+", ""), Base64.DEFAULT);
                      String safeName = (fileName != null && !fileName.trim().isEmpty())
                          ? fileName.trim().replaceAll("[\\\\/:*?\"<>|]", "_")
                          : ("wattappsau_" + System.currentTimeMillis());
                      String resolvedMime = resolveMimeTypeForAndroid(safeName, extractedMime);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentResolver resolver = getContentResolver();
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, safeName);
                          values.put(MediaStore.Downloads.MIME_TYPE, resolvedMime);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          values.put(MediaStore.Downloads.IS_PENDING, 1);

                          Uri itemUri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (itemUri == null) return false;
                          try (OutputStream os = resolver.openOutputStream(itemUri)) {
                              if (os == null) return false;
                              os.write(bytes);
                              os.flush();
                          }
                          values.clear();
                          values.put(MediaStore.Downloads.IS_PENDING, 0);
                          resolver.update(itemUri, values, null, null);

                          runOnUiThread(() -> {
                              Toast.makeText(MainActivity.this, "Tersimpan di Download: " + safeName, Toast.LENGTH_LONG).show();
                              try {
                                  Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                                  viewIntent.setDataAndType(itemUri, resolvedMime);
                                  viewIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(Intent.createChooser(viewIntent, "Buka " + safeName));
                              } catch (Exception ignored) {}
                          });
                          return true;
                      } else {
                          File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          if (!downloadsDir.exists()) downloadsDir.mkdirs();
                          File outFile = new File(downloadsDir, safeName);
                          try (FileOutputStream fos = new FileOutputStream(outFile)) {
                              fos.write(bytes);
                              fos.flush();
                          }
                          MediaScannerConnection.scanFile(this, new String[]{outFile.getAbsolutePath()}, new String[]{resolvedMime}, null);
                          DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                          if (dm != null) {
                              dm.addCompletedDownload(safeName, "WattappsAU Download", true, resolvedMime, outFile.getAbsolutePath(), bytes.length, true);
                          }
                          runOnUiThread(() -> {
                              Toast.makeText(MainActivity.this, "Tersimpan di Download: " + safeName, Toast.LENGTH_LONG).show();
                              try {
                                  startActivity(new Intent(DownloadManager.ACTION_VIEW_DOWNLOADS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                              } catch (Exception ignored) {}
                          });
                          return true;
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, "Gagal menyimpan file", Toast.LENGTH_SHORT).show());
                      return false;
                  }
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public String getFcmToken() {
                      return getSharedPreferences("wattappsau_prefs", MODE_PRIVATE)
                          .getString("fcm_token", "");
                  }

                  @JavascriptInterface
                  public boolean downloadFile(String dataUrlOrBase64, String fileName, String mimeType) {
                      return saveAndOpenBase64File(dataUrlOrBase64, fileName, mimeType);
                  }

                  @JavascriptInterface
                  public void showIncomingCall(String callerName, String callType) {
                      runOnUiThread(() -> displayIncomingCallNotification(callerName, callType));
                  }

                  @JavascriptInterface
                  public void dismissIncomingCall() {
                      runOnUiThread(() -> {
                          stopRingtoneAndVibration();
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.cancel(CALL_NOTIF_ID);
                      });
                  }

                  @JavascriptInterface
                  public void showIncomingMessage(String senderName, String messageText) {
                      runOnUiThread(() -> displayIncomingMessageNotification(senderName, messageText));
                  }
              }

              private void displayIncomingCallNotification(String callerName, String callType) {
                  wakeScreenBriefly(20000);
                  try {
                      Uri ringtoneUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                      currentRingtone = RingtoneManager.getRingtone(getApplicationContext(), ringtoneUri);
                      if (currentRingtone != null) currentRingtone.play();

                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) {
                          long[] pattern = {0, 800, 600, 800, 600};
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createWaveform(pattern, 0));
                          } else {
                              v.vibrate(pattern, 0);
                          }
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }

                  Intent fullScreenIntent = new Intent(this, MainActivity.class);
                  fullScreenIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent fullScreenPending = PendingIntent.getActivity(
                      this, 0, fullScreenIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  Intent answerIntent = new Intent(this, MainActivity.class);
                  answerIntent.setAction("ACTION_ANSWER_CALL");
                  answerIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent answerPending = PendingIntent.getActivity(
                      this, 1, answerIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  Intent declineIntent = new Intent(this, MainActivity.class);
                  declineIntent.setAction("ACTION_DECLINE_CALL");
                  declineIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent declinePending = PendingIntent.getActivity(
                      this, 2, declineIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  String title = (callerName != null && !callerName.isEmpty()) ? callerName : "Panggilan Masuk";
                  String text = "video".equalsIgnoreCase(callType) ? "Panggilan Video Masuk • WattappsAU" : "Panggilan Suara Masuk • WattappsAU";

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CALL_CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.sym_call_incoming)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setDefaults(NotificationCompat.DEFAULT_ALL)
                      .setAutoCancel(true)
                      .setOngoing(true)
                      .setFullScreenIntent(fullScreenPending, true)
                      .addAction(android.R.drawable.ic_menu_call, "ANGKAT", answerPending)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "TUTUP", declinePending);

                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify(CALL_NOTIF_ID, builder.build());

                  try {
                      startActivity(fullScreenIntent);
                  } catch (Exception ignored) {}
              }

              private void displayIncomingMessageNotification(String senderName, String messageText) {
                  wakeScreenBriefly(5000);
                  try {
                      Uri notifUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      Ringtone r = RingtoneManager.getRingtone(getApplicationContext(), notifUri);
                      if (r != null) r.play();

                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createOneShot(300, VibrationEffect.DEFAULT_AMPLITUDE));
                          } else {
                              v.vibrate(300);
                          }
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }

                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent openPending = PendingIntent.getActivity(
                      this, msgNotifCounter, openIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  String title = (senderName != null && !senderName.isEmpty()) ? senderName : "Pesan Baru";
                  String body = (messageText != null && !messageText.isEmpty()) ? messageText : "Mengirim pesan";

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, MSG_CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.stat_notify_chat)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setDefaults(NotificationCompat.DEFAULT_ALL)
                      .setAutoCancel(true)
                      .setContentIntent(openPending);

                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify(msgNotifCounter++, builder.build());
              }

              private void createNotificationChannels() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager == null) return;

                      Uri ringtoneUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                      AudioAttributes callAudioAttr = new AudioAttributes.Builder()
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .build();

                      NotificationChannel callChannel = new NotificationChannel(
                          CALL_CHANNEL_ID,
                          "Panggilan Masuk WattappsAU",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      callChannel.setDescription("Notifikasi layar penuh untuk panggilan masuk");
                      callChannel.setLockscreenVisibility(android.app.Notification.VISIBILITY_PUBLIC);
                      callChannel.enableVibration(true);
                      callChannel.setSound(ringtoneUri, callAudioAttr);
                      manager.createNotificationChannel(callChannel);

                      NotificationChannel msgChannel = new NotificationChannel(
                          MSG_CHANNEL_ID,
                          "Pesan Masuk WattappsAU",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      msgChannel.setDescription("Notifikasi pop-up pesan chat masuk");
                      msgChannel.setLockscreenVisibility(android.app.Notification.VISIBILITY_PUBLIC);
                      msgChannel.enableVibration(true);
                      manager.createNotificationChannel(msgChannel);
                  }
              }

              private void checkAndRequestPermissions() {
                  List<String> perms = new ArrayList<>();
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      perms.add(Manifest.permission.RECORD_AUDIO);
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      perms.add(Manifest.permission.CAMERA);
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      perms.add(Manifest.permission.ACCESS_FINE_LOCATION);
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      perms.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          perms.add(Manifest.permission.POST_NOTIFICATIONS);
                      }
                  }
                  if (!perms.isEmpty()) {
                      ActivityCompat.requestPermissions(this, perms.toArray(new String[0]), REQ_PERMS);
                  } else {
                      startKeepAliveServiceSafe();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_PERMS) {
                      startKeepAliveServiceSafe();
                  }
              }

              private void startKeepAliveServiceSafe() {
                  try {
                      Intent serviceIntent = new Intent(this, KeepAliveService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
