          cat << 'EOF' > "$PKG_DIR/WattappsFirebaseService.java"
          package mil.tniau.diskomlekau.wattappsau;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import androidx.annotation.NonNull;
          import androidx.core.app.NotificationCompat;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.util.Map;

          public class WattappsFirebaseService extends FirebaseMessagingService {
              @Override
              public void onNewToken(@NonNull String token) {
                  super.onNewToken(token);
                  getSharedPreferences("wattappsau_prefs", MODE_PRIVATE)
                      .edit()
                      .putString("fcm_token", token)
                      .apply();
              }

              @Override
              public void onMessageReceived(@NonNull RemoteMessage remoteMessage) {
                  super.onMessageReceived(remoteMessage);
                  try {
                      Map<String, String> data = remoteMessage.getData();
                      String type = data.containsKey("type") ? data.get("type") : "message";
                      String sender = data.containsKey("sender") ? data.get("sender") : "WattappsAU";
                      String body = data.containsKey("body") ? data.get("body") : "Ada pesan atau panggilan masuk";

                      wakeScreen();
                      showPushNotification(type, sender, body);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void wakeScreen() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null && !pm.isInteractive()) {
                          @SuppressWarnings("deprecation")
                          PowerManager.WakeLock wl = pm.newWakeLock(
                              PowerManager.SCREEN_BRIGHT_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP,
                              "WattappsAU::FCMWake"
                          );
                          wl.acquire(15000);
                      }
                  } catch (Exception ignored) {}
              }

              private void showPushNotification(String type, String title, String body) {
                  boolean isCall = "call".equalsIgnoreCase(type);
                  String channelId = isCall ? "wattappsau_incoming_call_v3" : "wattappsau_incoming_msg_v3";
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;

                  Uri soundUri = isCall
                      ? RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                      : RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(
                          channelId,
                          isCall ? "Panggilan Masuk WattappsAU" : "Pesan Masuk WattappsAU",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      ch.enableVibration(true);
                      ch.setLockscreenVisibility(android.app.Notification.VISIBILITY_PUBLIC);
                      AudioAttributes attr = new AudioAttributes.Builder()
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .setUsage(isCall ? AudioAttributes.USAGE_NOTIFICATION_RINGTONE : AudioAttributes.USAGE_NOTIFICATION)
                          .build();
                      ch.setSound(soundUri, attr);
                      nm.createNotificationChannel(ch);
                  }

                  try {
                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createOneShot(isCall ? 1500 : 350, VibrationEffect.DEFAULT_AMPLITUDE));
                          } else {
                              v.vibrate(isCall ? 1500 : 350);
                          }
                      }
                  } catch (Exception ignored) {}

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(
                      this, (int) System.currentTimeMillis(), intent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(isCall ? android.R.drawable.sym_call_incoming : android.R.drawable.stat_notify_chat)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(isCall ? NotificationCompat.CATEGORY_CALL : NotificationCompat.CATEGORY_MESSAGE)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setSound(soundUri)
                      .setAutoCancel(true)
                      .setFullScreenIntent(pi, true)
                      .setContentIntent(pi);

                  nm.notify((int) System.currentTimeMillis(), builder.build());
              }
          }
